[project]
name = "local-llm"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.13",
    "uvicorn>=0.34.3",
    "httpx>=0.28.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "openai>=2.44.0",
    "oracledb>=4.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
